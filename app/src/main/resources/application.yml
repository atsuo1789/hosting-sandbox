server:
  port: 8080

spring:
  application:
    name: relay-app

relay:
  # Helmから環境変数 RELAY_ENV_NAME で上書きされる
  env-name: local

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness, /readiness を有効化
