apiVersion: v1
kind: Service
metadata:
  name: {{ include "relay-app.fullname" . }}
  labels:
    {{- include "relay-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "relay-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
